name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Prepare docs structure (Runner only)
        run: |
          mkdir -p docs
          cp -r Dojo-101-* images docs/
          cp README.md docs/README.md
          cp CONTRIBUTING.md CODE_OF_CONDUCT.md SECURITY.md docs/ || true

      - name: Install static generator (Zensical / MkDocs)
        run: |
          pip install zensical mkdocs-material

      - name: Build static site
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: |
          if command -v zensical &> /dev/null; then
            echo "Building with modern engine Zensical..."
            zensical build
          else
            echo "Building with MkDocs..."
            mkdocs build
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
